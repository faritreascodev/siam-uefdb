version: '3.8'

networks:
  dokploy-network:
    external: true
  default:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: academyc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academyc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
      - default

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    # Use expose instead of ports to avoid host binding conflicts with Traefik
    expose:
      - 4000
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:123@postgres:5432/academyc_db}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-change-in-production-12345}"
      JWT_EXPIRATION: "7d"
      PORT: "4000"
      FRONTEND_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && pnpm run start:prod"
    networks:
      - dokploy-network
      - default

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:4000}
    restart: unless-stopped
    # Use expose instead of ports
    expose:
      - 3000
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://backend:4000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-super-secret-nextauth-key-change-in-production-67890}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "true"
    depends_on:
      - backend
    networks:
      - dokploy-network
      - default

volumes:
  postgres_data:

version: '3.8'

networks:
  dokploy-network:
    external: true
  default:

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: academyc_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academyc_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dokploy-network
      - default

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:123@postgres:5432/academyc_db}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-change-in-production-12345}"
      JWT_EXPIRATION: "7d"
      PORT: "4000"
      FRONTEND_URL: "${NEXTAUTH_URL:-https://siam.mltprdj.com}"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.rule=Host(`api-siam.mltprdj.com`)"
      - "traefik.http.routers.backend.entrypoints=websecure"
      - "traefik.http.routers.backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.backend.loadbalancer.server.port=4000"

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: "https://api-siam.mltprdj.com"
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "https://api-siam.mltprdj.com"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-super-secret-nextauth-key-change-in-production-67890}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "true"
    depends_on:
      - backend
    networks:
      - dokploy-network
      - default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=Host(`siam.mltprdj.com`)"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"

volumes:
  postgres_data:

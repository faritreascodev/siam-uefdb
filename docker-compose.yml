version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
      POSTGRES_DB: academyc_db
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d academyc_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # NestJS Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    environment:
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:123@postgres:5432/academyc_db}"
      JWT_SECRET: "${JWT_SECRET:-super-secret-jwt-key-change-in-production-12345}"
      JWT_EXPIRATION: "7d"
      PORT: "4000"
      FRONTEND_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
    depends_on:
      postgres:
        condition: service_healthy
    # Start app after migrating db
    command: sh -c "npx prisma migrate deploy && pnpm run start:prod"

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:4000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: "${NEXT_PUBLIC_API_URL:-http://backend:4000}"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET:-super-secret-nextauth-key-change-in-production-67890}"
      NEXTAUTH_URL: "${NEXTAUTH_URL:-http://localhost:3000}"
    depends_on:
      - backend

volumes:
  postgres_data:
